name: Release Drag-and-Drop Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing git tag to publish, for example v3.2.15"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-dragdrop:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        shell: pwsh
        run: |
          if ("${env:GITHUB_EVENT_NAME}" -eq "workflow_dispatch") {
            $tagName = "${{ inputs.tag_name }}"
            git fetch --tags --force
            git checkout $tagName
          }
          else {
            $tagName = "${env:GITHUB_REF_NAME}"
          }

          $version = $tagName.Substring(1)
          $outputDir = Join-Path $env:RUNNER_TEMP "dragdrop-release-$version"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $notesPath = Join-Path $env:RUNNER_TEMP "release_notes.md"
          $lines = Get-Content "CHANGELOG.md"
          $capture = $false
          $notes = New-Object System.Collections.Generic.List[string]
          foreach ($line in $lines) {
            if ($line -match "^##\s+$([regex]::Escape($version))(\s|$)") {
              $capture = $true
              continue
            }
            if ($capture -and $line -match "^##\s+") {
              break
            }
            if ($capture) {
              $notes.Add($line)
            }
          }
          if ($notes.Count -eq 0) {
            $notes.Add("- Release tag: $tagName")
            $notes.Add("- Drag-and-drop package built from repository root files.")
          }
          Set-Content -Path $notesPath -Value $notes -Encoding UTF8

          "TAG_NAME=$tagName" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV
          "OUTPUT_DIR=$outputDir" >> $env:GITHUB_ENV
          "NOTES_PATH=$notesPath" >> $env:GITHUB_ENV

      - name: Build drag-and-drop release archives
        shell: pwsh
        run: |
          & ".\tools\build_dragdrop_release.ps1" -Version "${env:VERSION}" -OutputRoot "${env:OUTPUT_DIR}" -Clean

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: DB_export_v3 v${{ env.VERSION }}
          body_path: ${{ env.NOTES_PATH }}
          files: |
            ${{ env.OUTPUT_DIR }}\DB_export_v3_dragdrop_v${{ env.VERSION }}.zip
            ${{ env.OUTPUT_DIR }}\DB_export_v3_dragdrop_v${{ env.VERSION }}.7z
          overwrite_files: true
          fail_on_unmatched_files: true
